# DeepSeek Harness — nginx reverse proxy for LAN-restricted Web UI access.
#
# The web app binds 127.0.0.1 (it rejects --host 0.0.0.0 for RCE safety).
# nginx binds 0.0.0.0 and proxies to the loopback backend, restricting
# clients to the configured CIDR via allow/deny. Placeholders
# (__LISTEN_PORT__, __ALLOW_CIDR__) are substituted by docker/entrypoint.sh
# at container start. The backend port (3081) is fixed by the entrypoint.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/nginx-access.log;
    error_log /tmp/nginx-error.log warn;

    upstream dsh_backend {
        server 127.0.0.1:3081;
        keepalive 32;
    }

    server {
        listen __LISTEN_PORT__;
        server_name _;

        # LAN access restriction: only the configured CIDR may connect.
        allow __ALLOW_CIDR__;
        deny all;

        # WebSocket + SSE support for the interactive UI.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Rewrite Host and Origin to the loopback backend so the app's
        # browser-trust fence (which requires Host to be loopback or a
        # trusted authority, and Origin to match Host) accepts the request.
        # nginx's allow/deny above is the real access-control layer; the
        # app trusts the proxy for pre-authorized traffic.
        proxy_set_header Host 127.0.0.1:3081;
        proxy_set_header Origin http://127.0.0.1:3081;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for SSE streaming; allow long-lived connections.
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # crypto.randomUUID is only available in secure contexts (HTTPS or
        # localhost). LAN access over plain HTTP is not a secure context, so
        # inject a polyfill (backed by crypto.getRandomValues, which is always
        # available) before the app code runs. Strip Accept-Encoding so the
        # backend serves uncompressed HTML that sub_filter can rewrite.
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<script>if(!crypto.randomUUID){crypto.randomUUID=function(){return([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,function(c){return(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)})}};</script></head>';
        sub_filter_once on;
        sub_filter_types text/html;

        location / {
            proxy_pass http://dsh_backend;
        }
    }
}
